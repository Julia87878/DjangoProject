{% extends 'catalog/base.html' %}

{% block title %}Удалить рецепт{% endblock %}

{% block content %}
{% include 'blog/includes/header.html' %}
<h2>Удалить рецепт</h2>
<p>Вы уверены, что хотите удалить "{{post.title}}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'blog:posts_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
