<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Супермаркет "Семёрочка"</h5>
    <nav class="ms-5">
        <a class="p-2 btn btn-outline-success" href="{% url 'catalog:products_list' %}">Главная страница</a>
        <a class="p-2 btn btn-outline-success" href="{% url 'catalog:categories_list' %}">Категории</a>
        <a class="p-2 btn btn-outline-success" href="{% url 'catalog:product_create' %}">Добавить продукт</a>
                {% if user.is_authenticated %}

	                    <form method="post" action="{% url 'users:logout' %}" style="display: inline;">
	                        {% csrf_token %}
	                        <button type="submit" class="btn btn-outline-success">Выйти
	                        </button>
	                    </form>
                {% else %}
                        <a class="btn btn-outline-success" href="{% url 'users:login' %}">Войти</a>
                        <a class="btn btn-outline-success" href="{% url 'users:register' %}">Регистрация</a>
                {% endif %}
        <a class="p-2 btn btn-outline-success" href="{% url 'catalog:contacts' %}">Контакты</a>
        <a class="p-2 btn btn-outline-success" href="{% url 'blog:posts_list' %}">Блог</a>
    </nav>
</div>
