{% extends 'catalog/base.html' %}

{% block title %}Удалить продукт{% endblock %}

{% block content %}
{% include 'catalog/includes/header.html' %}
<div class="container mt-5">
<h2>Удалить продукт</h2>
<p class = "form-control">Вы уверены, что хотите удалить "{{product.name}}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'catalog:products_list' %}" class="btn btn-secondary">Отмена</a>
</form>
</div>
{% endblock %}
